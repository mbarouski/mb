name: Deploy to surge.sh

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Deploy
      run: ./deploy-to-surge.sh
      env:
        SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
        SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
